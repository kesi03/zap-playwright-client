name: Test Playwright Client Add-on

on:
  workflow_dispatch:

jobs:
  test-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # -------------------------------
      # CHECKOUT REPOS
      # -------------------------------
      - name: Checkout add-on repo
        uses: actions/checkout@v4
        with:
          path: addon

      - name: Checkout zap-downloader
        uses: actions/checkout@v4
        with:
          repository: kesi03/zap-downloader
          path: zap-downloader

      # -------------------------------
      # JAVA + NODE SETUP
      # -------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack + pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      # -------------------------------
      # BUILD ADD-ON
      # -------------------------------
      - name: Build add-on
        working-directory: addon
        run: |
          chmod +x gradlew
          ./gradlew build -x test

          ls build/zapAddOn -asg 

          ls build/zapAddOn/bin -asg

          # Find built artifact
          ADDON=$(ls build/zapAddOn/bin/*.zap 2>/dev/null | head -1 || true)
          if [ -z "$ADDON" ]; then
            ADDON=$(ls build/libs/*.jar 2>/dev/null | head -1 || true)
          fi
          if [ -z "$ADDON" ]; then
            echo "No add-on artifact found"
            exit 1
          fi

          echo "ADDON_PATH=$ADDON" >> $GITHUB_ENV
          echo "Add-on artifact: $ADDON"

      # -------------------------------
      # BUILD ZAP-DOWNLOADER
      # -------------------------------
      - name: Install zap-downloader dependencies
        working-directory: zap-downloader/apps/zap-downloader-node
        run: pnpm install

      - name: Build zap-downloader
        working-directory: zap-downloader/apps/zap-downloader-node
        run: pnpm build

      # -------------------------------
      # CREATE OFFLINE PACKAGE
      # -------------------------------
      - name: Create offline package
        working-directory: zap-downloader/apps/zap-downloader-node
        run: |
          pnpm offline:pack
          PKG=$(ls zap-offline-*.tar | head -1)
          echo "OFFLINE_PACKAGE=$PKG" >> $GITHUB_ENV

      - name: Unpack offline package
        working-directory: zap-downloader/apps/zap-downloader-node
        run: |
          pnpm ts-node src/index.ts offline unpack \
            -i "${{ env.OFFLINE_PACKAGE }}" \
            -o test-unpack

      # -------------------------------
      # INSTALL ADD-ON INTO ZAP
      # -------------------------------
      - name: Install add-on into ZAP plugin dir
        run: |
          PLUGIN_DIR=$(find zap-downloader/apps/zap-downloader-node/test-unpack -type d -name plugin | head -1)
          echo "PLUGIN_DIR=$PLUGIN_DIR"

          cp "addon/${{ env.ADDON_PATH }}" "$PLUGIN_DIR/"
          ls -la "$PLUGIN_DIR"

      # -------------------------------
      # PATCH TOML (ZGC FIX)
      # -------------------------------
      - name: Patch TOML for ZGC compat
        working-directory: zap-downloader/apps/zap-downloader-node
        run: |
          TOML=$(find test-unpack -name default.toml | head -1)
          if grep -q "UseZGC" "$TOML" && ! grep -q "UnlockExperimentalVMOptions" "$TOML"; then
            sed -i '/-XX:+UseZGC/i\  "-XX:+UnlockExperimentalVMOptions",' "$TOML"
          fi

      # -------------------------------
      # INSTALL PLAYWRIGHT BROWSERS
      # -------------------------------
      - name: Checkout repo root
        uses: actions/checkout@v4
        with:
          repository: kesi03/zap-playwright-client
          path: repo-root

      - name: Install root pnpm dependencies
        working-directory: repo-root
        run: |
          # Install dev dependencies declared in the repo root (includes Playwright)
          pnpm install

      - name: Install Playwright browsers and OS dependencies
        working-directory: repo-root
        run: |
          set -e
          # Ensure a stable Playwright version matching the Java dependency is installed and browsers downloaded
          mkdir -p zap-downloader/apps/zap-downloader-node/test-unpack/workspace/.playwright
          export PLAYWRIGHT_BROWSERS_PATH=$(pwd)/zap-downloader/apps/zap-downloader-node/test-unpack/workspace/.playwright

          # Install common system dependencies for Playwright on ubuntu-latest
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            fonts-liberation \
            libasound2 \
            libasound2t64 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxrandr2 \
            libxss1 \
            libxshmfence1 \
            libxtst6 \
            libegl1 \
            wget \
            gnupg \
            libxcb1 \
            libffi8 \
            libx264-dev || true

          # Use pnpm exec from repo root (playwright is installed in root devDependencies)
          pnpm exec playwright install-deps || true
          pnpm exec playwright install --with-deps || true

          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
          echo "Contents of PLAYWRIGHT_BROWSERS_PATH:"
          ls -la "$PLAYWRIGHT_BROWSERS_PATH" || true
          echo "Playwright version:"
          pnpm exec playwright --version || true

      # -------------------------------
      # START ZAP DAEMON
      # -------------------------------
      - name: Start daemon
        working-directory: zap-downloader/apps/zap-downloader-node
        run: |
          TOML=$(find test-unpack -name default.toml | head -1)
          # Ensure Playwright browsers are discoverable by Playwright Java
          export PLAYWRIGHT_BROWSERS_PATH="$(pwd)/test-unpack/workspace/.playwright"
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=true
          pnpm ts-node src/index.ts daemon start -t "$TOML"

      - name: Wait for daemon
        working-directory: zap-downloader/apps/zap-downloader-node
        run: pnpm ts-node src/index.ts daemon started --timeout 100 --host 127.0.0.1

      # -------------------------------
      # DEBUG LOGS
      # -------------------------------
      - name: Debug ZAP logs
        if: always()
        working-directory: zap-downloader/apps/zap-downloader-node
        run: |
          echo "=== PM2 list ==="
          npx pm2 list || true
          echo "=== Java processes ==="
          ps aux | grep java || true
          echo "=== ZAP log (head -100) ==="
          cat test-unpack/workspace/.zap/zap.log | head -100 || true

      - name: Upload full ZAP log (CI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-log
          path: zap-downloader/apps/zap-downloader-node/test-unpack/workspace/.zap/zap.log
          retention-days: 7

      # -------------------------------
      # TRIGGER PLAYWRIGHT ADD-ON
      # -------------------------------
      - name: Trigger Playwright add-on API
        run: |
          curl -s "http://127.0.0.1:8080/JSON/playwrightclient/action/runCrawlAndScan?url=http://example.com" -o /tmp/out.json
          cat /tmp/out.json

      - name: Upload ZAP log after run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-log-after-run
          path: zap-downloader/apps/zap-downloader-node/test-unpack/workspace/.zap/zap.log
          retention-days: 7

      # -------------------------------
      # STOP DAEMON
      # -------------------------------
      - name: Stop daemon
        if: always()
        working-directory: zap-downloader/apps/zap-downloader-node
        run: pnpm ts-node src/index.ts daemon stop

      # -------------------------------
      # UPLOAD ARTIFACT
      # -------------------------------
      - name: Upload add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-playwright-client
          path: ${{ env.ADDON_PATH }}
          retention-days: 7
