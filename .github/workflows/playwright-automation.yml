name: Playwright Client Automation

on:
  workflow_dispatch:
    inputs:
      target-url:
        description: "Target URL to scan"
        required: true
        default: "http://example.com"
  workflow_call:
    inputs:
      target-url:
        description: "Target URL to scan"
        required: true
        type: string

jobs:
  playwright-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack + pin pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Build add-on
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build -x test
          ADDON=$(ls build/zapAddOn/bin/*.zap 2>/dev/null | head -1 || true)
          if [ -z "$ADDON" ]; then
            ADDON=$(ls build/libs/*.jar 2>/dev/null | head -1 || true)
          fi
          if [ -z "$ADDON" ]; then
            echo "No add-on artifact found"
            exit 1
          fi
          echo "ADDON_PATH=$ADDON" >> $GITHUB_ENV
          echo "Add-on artifact: $ADDON"

      - name: Install npm dependencies
        shell: bash
        run: pnpm install

      - name: Create offline ZAP package
        shell: bash
        run: |
          pnpm exec zap-downloader offline pack -o zap-offline.tar
          echo "OFFLINE_PACKAGE=zap-offline.tar" >> $GITHUB_ENV

      - name: Unpack offline package
        shell: bash
        run: |
          pnpm exec zap-downloader offline unpack \
            -i "${{ env.OFFLINE_PACKAGE }}" \
            -o zap-install
          echo "UNPACK_DIR=zap-install" >> $GITHUB_ENV

      - name: Install add-on into ZAP
        shell: bash
        run: |
          PLUGIN_DIR=$(find zap-install -type d -name plugin | head -1)
          echo "PLUGIN_DIR=$PLUGIN_DIR"
          cp "${{ env.ADDON_PATH }}" "$PLUGIN_DIR/"

      - name: Install Playwright browsers
        shell: bash
        run: pnpm exec playwright install chromium --with-deps

      - name: Pre-extract Playwright Java driver
        shell: bash
        run: |
          # Playwright Java's DriverJar uses getResource("/driver/linux/node") to
          # find the driver binary, but ZAP's add-on classloader doesn't expose
          # resources nested inside .zap bundles. Pre-extract the full driver/linux/
          # directory tree and set PLAYWRIGHT_NODE_PATH to bypass classpath lookup.
          mkdir -p playwright-java-driver
          python -c "
          import zipfile, sys
          z = zipfile.ZipFile(sys.argv[1], 'r')
          for f in z.namelist():
              if f.startswith('driver/linux/'):
                  z.extract(f, sys.argv[2])
          z.close()
          " "${{ env.ADDON_PATH }}" playwright-java-driver
          chmod +x playwright-java-driver/driver/linux/node
          echo "PLAYWRIGHT_NODE_PATH=$(pwd)/playwright-java-driver/driver/linux/node" >> $GITHUB_ENV

      - name: Create ZAP automation plan
        shell: bash
        run: |
          cat > playwright-plan.yaml << 'EOF'
          env:
            contexts:
              - name: "mainContext"
                urls:
                  - "{{TARGET_URL}}"
                includePaths:
                  - "{{TARGET_URL}}.*"
          jobs:
            - type: "passiveScan-config"
              parameters:
                maxAlertsPerRule: 0
            - type: "spider"
              parameters:
                context: "mainContext"
                url: "{{TARGET_URL}}"
            - type: "spiderAjax"
              parameters:
                context: "mainContext"
                url: "{{TARGET_URL}}"
                maxDuration: 5
            - type: "playwright"
              parameters:
                url: "{{TARGET_URL}}"
                maxDepth: 5
                maxDuration: 10
          EOF
          sed -i "s|{{TARGET_URL}}|${{ inputs.target-url }}|g" playwright-plan.yaml
          echo "Generated automation plan:"
          cat playwright-plan.yaml

      - name: Start daemon and run automation plan
        shell: bash
        run: |
          pnpm exec zapr daemon autorun \
            --plan playwright-plan.yaml \
            --workspace "$(pwd)/zap-install/workspace"

      - name: Display results
        if: always()
        run: |
          echo "## Playwright Client Automation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ inputs.target-url }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload ZAP log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-log
          path: zap-install/workspace/.zap/zap.log
          retention-days: 7

      - name: Stop daemon
        if: always()
        shell: bash
        run: pnpm exec zapr daemon stop || true
